name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject secrets into config
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLIC_KEY: ${{ secrets.VITE_SUPABASE_PUBLIC_KEY }}
        run: |
          sed -i "s|__VITE_SUPABASE_URL__|${VITE_SUPABASE_URL}|g" quality-monitoring/js/config.js
          sed -i "s|__VITE_SUPABASE_PUBLIC_KEY__|${VITE_SUPABASE_PUBLIC_KEY}|g" quality-monitoring/js/config.js
          if grep -q "__VITE_" quality-monitoring/js/config.js; then
            echo "ERROR: placeholders not replaced — check VITE_SUPABASE_URL and VITE_SUPABASE_PUBLIC_KEY are set in repository secrets."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload quality-monitoring as site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./quality-monitoring

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
