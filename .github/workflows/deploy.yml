name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject secrets into config
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "${VITE_SUPABASE_URL}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "ERROR: one or both secrets are empty. Set VITE_SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY in repository Settings → Secrets and variables → Actions."
            exit 1
          fi
          sed -i "s|__VITE_SUPABASE_URL__|${VITE_SUPABASE_URL}|g" quality-monitoring/js/config.js
          sed -i "s|__SUPABASE_PUBLISHABLE_KEY__|${SUPABASE_PUBLISHABLE_KEY}|g" quality-monitoring/js/config.js
          if grep -q "__VITE_" quality-monitoring/js/config.js; then
            echo "ERROR: placeholders still present after substitution — check secret names match exactly."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload quality-monitoring as site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./quality-monitoring

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
